name: Sync from upstream

# Deploy-mirror discipline: this fork's main tracks
# The-Purple-Movement/Beyond-Syllabus main automatically, so the
# Vercel deployment (which builds this fork) can never drift from
# the community repo.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'deepusnath/Beyond-Syllabus'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/The-Purple-Movement/Beyond-Syllabus.git
          git fetch upstream main
          git merge upstream/main --no-edit
          git push origin main
